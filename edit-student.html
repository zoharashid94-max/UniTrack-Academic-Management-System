<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | UniTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --bg: #080b18;
            --panel: #11162a;
            --border: #252d48;
            --text: #f0f2ff;
            --muted: #969fbd;
            --purple: #8b5cf6;
            --blue: #528bff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 245px;
            min-height: 100vh;
            position: fixed;
            padding: 28px 18px;
            background: #0c1021;
            border-right: 1px solid var(--border);
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 38px;
        }

        .brand span { color: #a78bfa; }

        .nav-link {
            color: var(--muted);
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            background: linear-gradient(100deg, #7546df, #426eea);
        }

        .main {
            margin-left: 245px;
            padding: 35px;
        }

        .muted { color: var(--muted); }

        .panel {
            max-width: 850px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
        }

        .form-control, .form-select {
            background: #0b1022;
            color: var(--text);
            border: 1px solid #303956;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            background: #0b1022;
            color: white;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px #8b5cf633;
        }

        .form-select option {
            background: #11162a;
            color: white;
        }

        .btn-primary {
            border: 0;
            background: linear-gradient(100deg, var(--purple), var(--blue));
            padding: 11px 22px;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/unitrack-theme.css}">
</head>

<body>

<aside class="sidebar">
    <div class="brand">Uni<span>Track</span></div>

    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/}">▦ &nbsp; Dashboard</a>
        <a class="nav-link active" th:href="@{/students}">♙ &nbsp; Students</a>
        <a class="nav-link" href="#"
           onclick="alert('Course Management is coming next!'); return false;">
            ▤ &nbsp; Courses
        </a>
        <a class="nav-link" href="#"
           onclick="alert('Enrollment Management is coming next!'); return false;">
            ▣ &nbsp; Enrollments
        </a>
        <a class="nav-link" href="#"
           onclick="alert('Grade Management is coming next!'); return false;">
            ◈ &nbsp; Grades
        </a>
    </nav>

    <div class="mt-5 small muted">UNIVERSITY MANAGEMENT SYSTEM</div>
</aside>

<main class="main">
    <div class="mb-4">
        <p class="muted mb-2">Dashboard / Students / Edit</p>
        <h1 class="h2 fw-bold mb-2">Edit Student</h1>
        <p class="muted">Update the student's academic information.</p>
    </div>

    <section class="panel">
        <h2 class="h5 fw-bold mb-1">Student Information</h2>
        <p class="muted small mb-4">
            Student ID:
            <strong th:text="${student.id}">1</strong>
        </p>

        <form th:action="@{/students/update/{id}(id=${student.id})}"
              method="post">

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text"
                           class="form-control"
                           id="fullName"
                           name="fullName"
                           th:value="${student.fullName}"
                           maxlength="150"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           th:value="${student.email}"
                           maxlength="254"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="department" class="form-label">Department</label>
                    <select class="form-select"
                            id="department"
                            name="department"
                            required>
                        <option value="Computer Science"
                                th:selected="${student.department == 'Computer Science'}">
                            Computer Science
                        </option>
                        <option value="Software Engineering"
                                th:selected="${student.department == 'Software Engineering'}">
                            Software Engineering
                        </option>
                        <option value="Information Technology"
                                th:selected="${student.department == 'Information Technology'}">
                            Information Technology
                        </option>
                        <option value="Data Science"
                                th:selected="${student.department == 'Data Science'}">
                            Data Science
                        </option>
                        <option value="Business Administration"
                                th:selected="${student.department == 'Business Administration'}">
                            Business Administration
                        </option>
                        <option value="Electrical Engineering"
                                th:selected="${student.department == 'Electrical Engineering'}">
                            Electrical Engineering
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="semester" class="form-label">Semester</label>
                    <select class="form-select"
                            id="semester"
                            name="semester"
                            required>
                        <option value="1st Semester"
                                th:selected="${student.semester == '1st Semester'}">
                            1st Semester
                        </option>
                        <option value="2nd Semester"
                                th:selected="${student.semester == '2nd Semester'}">
                            2nd Semester
                        </option>
                        <option value="3rd Semester"
                                th:selected="${student.semester == '3rd Semester'}">
                            3rd Semester
                        </option>
                        <option value="4th Semester"
                                th:selected="${student.semester == '4th Semester'}">
                            4th Semester
                        </option>
                        <option value="5th Semester"
                                th:selected="${student.semester == '5th Semester'}">
                            5th Semester
                        </option>
                        <option value="6th Semester"
                                th:selected="${student.semester == '6th Semester'}">
                            6th Semester
                        </option>
                        <option value="7th Semester"
                                th:selected="${student.semester == '7th Semester'}">
                            7th Semester
                        </option>
                        <option value="8th Semester"
                                th:selected="${student.semester == '8th Semester'}">
                            8th Semester
                        </option>
                    </select>
                </div>

                <div class="col-12 d-flex flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a th:href="@{/students}"
                       class="btn btn-outline-light">
                        Cancel
                    </a>
                </div>
            </div>
        </form>
    </section>
</main>

</body>
</html>
