
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course | UniTrack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080b18;
            color: #f4f5ff;
            padding: 35px 20px;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: #11162a;
            border: 1px solid #252b46;
            border-radius: 18px;
            padding: 30px;
        }
        h1 { margin-top: 0; font-size: 27px; }
        p { color: #a7aec8; margin-bottom: 28px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        .field { display: flex; flex-direction: column; gap: 9px; }
        label { color: #cbd0e6; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0b1020;
            color: #f4f5ff;
            border: 1px solid #303957;
            border-radius: 9px;
            outline: none;
        }
        input:focus, select:focus { border-color: #8b5cf6; }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        button, .back {
            padding: 12px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        button {
            border: none;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
        }
        .back {
            color: #e1e5ff;
            background: #252b46;
        }
        @media (max-width: 550px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { padding: 22px; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/unitrack-theme.css}">
</head>
<body>
<div class="container">
    <h1>Edit Course</h1>
    <p>Update the course information below.</p>

    <form th:action="@{/courses/update/{id}(id=${course.id})}"
          method="post">

        <div class="form-grid">
            <div class="field">
                <label for="courseName">Course Name</label>
                <input id="courseName" name="courseName" type="text"
                       th:value="${course.courseName}" required>
            </div>

            <div class="field">
                <label for="courseCode">Course Code</label>
                <input id="courseCode" name="courseCode" type="text"
                       th:value="${course.courseCode}" required>
            </div>

            <div class="field">
                <label for="department">Department</label>
                <input id="department" name="department" type="text"
                       th:value="${course.department}" required>
            </div>

            <div class="field">
                <label for="creditHours">Credit Hours</label>
                <input id="creditHours" name="creditHours" type="number"
                       min="1" max="12"
                       th:value="${course.creditHours}" required>
            </div>

            <div class="field">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="Semester 1"
                            th:selected="${course.semester == 'Semester 1'}">Semester 1</option>
                    <option value="Semester 2"
                            th:selected="${course.semester == 'Semester 2'}">Semester 2</option>
                    <option value="Semester 3"
                            th:selected="${course.semester == 'Semester 3'}">Semester 3</option>
                    <option value="Semester 4"
                            th:selected="${course.semester == 'Semester 4'}">Semester 4</option>
                    <option value="Semester 5"
                            th:selected="${course.semester == 'Semester 5'}">Semester 5</option>
                    <option value="Semester 6"
                            th:selected="${course.semester == 'Semester 6'}">Semester 6</option>
                    <option value="Semester 7"
                            th:selected="${course.semester == 'Semester 7'}">Semester 7</option>
                    <option value="Semester 8"
                            th:selected="${course.semester == 'Semester 8'}">Semester 8</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button type="submit">Save Changes</button>
            <a class="back" th:href="@{/courses}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
